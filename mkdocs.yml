site_name: Book Mascots
site_description: A gallery of mascots used across our intelligent textbooks
site_author: Dan McCreary
repo_url: https://github.com/dmccreary/book-mascots
site_url: https://dmccreary.github.io/book-mascots/
edit_uri: edit/main/docs/

exclude_docs: |
  image-prompts.md
  mascot-prompts.md
  mascot-descriptions.md

nav:
