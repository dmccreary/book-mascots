  - About: about.md
  - Mascot Image Quality: mascot-image-quality.md
  - Mascot Effectiveness Research: mascot-effectivness.md
  - Gender-Neutral Names: gender-neutral-names.md
  - Mascot Test: mascot-test.md
  - Mascot Gallery: list-mascots.md
  - Mascot Montage: mascot-montage.md
  - Mascot Ideas: mascot-ideas.md
  - Mascots:
      - Beaver – Bailey (Ecology): mascots/ecology/index.md
      - Cat – Catalyst (Chemistry): mascots/chemistry/index.md
      - Elephant – Bloom (Learning Sciences): mascots/learning-sciences/index.md
      - Ferret – Fermi (Quantum Computing): mascots/quantum-computing/index.md
      - Fox – Ferris (Economics): mascots/economics-course/index.md
      - Fox – Sentinel (Cybersecurity): mascots/cybersecurity/index.md
      - Fruit Fly – Dottie (Genetics): mascots/genetics/index.md
      - Honey Bee – Buzz (Networking): mascots/networking/index.md
      - Hummingbird – Iris (Info Systems): mascots/information-systems/index.md
      - Octopus – Olli (Bioinformatics): mascots/bioinformatics/index.md
      - Otter – Maka (Digital Citizenship): mascots/digital-citizenship/index.md
      - Owl – Axiom (Textbooks): mascots/intelligent-textbooks/index.md
      - Owl – Sofia (Knowledge): mascots/theory-of-knowledge/index.md
      - Parrot – Polly (Prompting): mascots/prompt-class/index.md
      - Peacock – Percy (Infographics): mascots/infographics/index.md
      - Raccoon – Rex (Blockchain): mascots/blockchain/index.md
      - Raccoon – Rick (Functions): mascots/functions/index.md
      - Red Panda – Pemba (Token): mascots/token-efficiency/index.md
      - Squirrel – Sylvia (Finance): mascots/personal-finance/index.md
      - Squirrel – Sylvia (Statistics): mascots/statistics-course/index.md
      - Tortoise – Chronos (History): mascots/ancient-history/index.md
      - Tree Frog – Gregor (Biology): mascots/biology/index.md
      - Tree Frog – Mossby (Moss): mascots/moss/index.md
      - Unicorn – Sparkle: mascots/unicorns/index.md
      - "— Abstract – Tokie (Dementia)": mascots/Dementia/index.md
      - "— Explorer – Delta (Calculus)": mascots/calculus/index.md
      - "— Lightbulb – Sparky (Circuits)": mascots/circuits/index.md
      - "— Robot – Prema (Pre-Calc)": mascots/pre-calc/index.md
  - References: references.md
  - License: license.md
  - Contact: contact.md

# Theme and features from here
theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - css/extra.css
  - css/mascot.css

extra_javascript:
  - js/extra.js
