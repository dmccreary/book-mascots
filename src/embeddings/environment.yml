# Conda environment for the mascot visual-similarity pipeline.
#
# Most deps come from conda-forge (which has prebuilt CPU+MKL wheels for
# pytorch and prebuilt llvmlite for umap-learn — both gaps in plain pip
# on Python 3.13 + Intel macOS). sentence-transformers is pip-only,
# declared in the pip sub-block below.
#
# Install (fresh env):
#     conda env create -n mkdocs -f src/embeddings/environment.yml
#
# Update existing env (most common):
#     conda env update -n mkdocs -f src/embeddings/environment.yml

channels:
  - conda-forge

dependencies:
  - python>=3.11
  - pillow>=10.0
  - pytorch
  - scikit-learn>=1.3
  - umap-learn>=0.5
  - pip
  - pip:
      - sentence-transformers>=2.7
